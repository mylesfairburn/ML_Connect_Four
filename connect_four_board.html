
<style>
  .cf-wrap { padding: 1.5rem 0; font-family: var(--font-sans); }
  .scoreboard { display: flex; justify-content: center; align-items: center; gap: 2rem; margin-bottom: 1.5rem; }
  .score-card { text-align: center; }
  .score-label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-secondary); margin-bottom: 4px; }
  .score-num { font-size: 36px; font-weight: 500; line-height: 1; color: var(--color-text-primary); }
  .score-divider { font-size: 24px; color: var(--color-text-secondary); padding-top: 12px; }
  .player-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .status-bar { text-align: center; margin-bottom: 1rem; font-size: 15px; color: var(--color-text-secondary); min-height: 22px; }
  .board-outer { display: flex; justify-content: center; }
  .board { background: #1a6fbd; border-radius: 12px; padding: 10px; display: inline-grid; grid-template-columns: repeat(7, 1fr); gap: 8px; box-shadow: 0 4px 0 #0e4d8a; }
  .cell { width: 60px; height: 60px; border-radius: 50%; background: #0e3d6e; transition: background 0.15s; cursor: pointer; }
  .cell:hover { background: #0a2d54; }
  .cell.player { background: #f5c518; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); cursor: default; }
  .cell.player:hover { background: #f5c518; }
  .cell.ai { background: #e8392a; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); cursor: default; }
  .cell.ai:hover { background: #e8392a; }
  .cell.win { animation: pulse 0.5s ease-in-out infinite alternate; }
  .cell.dim { opacity: 0.3; }
  @keyframes pulse { from { transform: scale(1); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); } to { transform: scale(1.12); box-shadow: 0 0 12px rgba(255,255,255,0.5); } }
  .reset-btn { display: block; margin: 1.25rem auto 0; padding: 8px 24px; font-size: 14px; border-radius: 6px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-primary); cursor: pointer; }
  .reset-btn:hover { background: var(--color-background-secondary); }
  .drop-preview { opacity: 0.55; }
</style>
<div class="cf-wrap">
  <h2 class="sr-only">Connect Four game board</h2>
  <div class="scoreboard">
    <div class="score-card">
      <div class="score-label"><span class="player-dot" style="background:#f5c518"></span>You</div>
      <div class="score-num" id="score-player">0</div>
    </div>
    <div class="score-divider">–</div>
    <div class="score-card">
      <div class="score-label"><span class="player-dot" style="background:#e8392a"></span>AI</div>
      <div class="score-num" id="score-ai">0</div>
    </div>
  </div>
  <div class="status-bar" id="status">Your turn</div>
  <div class="board-outer">
    <div class="board" id="board"></div>
  </div>
  <button class="reset-btn" id="reset-btn">New game</button>
</div>
<script>
const ROWS = 6, COLS = 7;
let grid, currentPlayer, gameOver, scores = {player: 0, ai: 0};

function init() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  currentPlayer = 'player';
  gameOver = false;
  render();
  setStatus('Your turn');
}

function render(winCells) {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const winSet = new Set((winCells || []).map(([r,c]) => r+','+c));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      const key = r+','+c;
      let cls = 'cell';
      if (grid[r][c]) cls += ' ' + grid[r][c];
      if (winCells) {
        if (winSet.has(key)) cls += ' win';
        else if (grid[r][c]) cls += ' dim';
      }
      cell.className = cls;
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.addEventListener('click', () => handleClick(c));
      cell.addEventListener('mouseenter', () => hoverCol(c, true));
      cell.addEventListener('mouseleave', () => hoverCol(c, false));
      board.appendChild(cell);
    }
  }
}

function hoverCol(col, on) {
  if (gameOver || currentPlayer !== 'player') return;
  document.querySelectorAll('.cell').forEach(c => {
    if (parseInt(c.dataset.col) === col && !c.classList.contains('player') && !c.classList.contains('ai')) {
      on ? c.classList.add('drop-preview') : c.classList.remove('drop-preview');
    }
  });
}

function handleClick(col) {
  if (gameOver || currentPlayer !== 'player') return;
  const row = drop(col, 'player');
  if (row === -1) return;
  render();
  const win = getWinCells(row, col, 'player');
  if (win) { endGame('player', win); return; }
  if (isDraw()) { endGame(null, null); return; }
  currentPlayer = 'ai';
  setStatus('AI is thinking…');
  setTimeout(() => aiMove(), 400);
}

function drop(col, who) {
  for (let r = ROWS - 1; r >= 0; r--) {
    if (!grid[r][col]) { grid[r][col] = who; return r; }
  }
  return -1;
}

function aiMove() {
  const col = pickAiCol();
  const row = drop(col, 'ai');
  render();
  const win = getWinCells(row, col, 'ai');
  if (win) { endGame('ai', win); return; }
  if (isDraw()) { endGame(null, null); return; }
  currentPlayer = 'player';
  setStatus('Your turn');
}

function pickAiCol() {
  for (let c = 0; c < COLS; c++) { if (wouldWin(c, 'ai')) return c; }
  for (let c = 0; c < COLS; c++) { if (wouldWin(c, 'player')) return c; }
  const pref = [3,2,4,1,5,0,6];
  for (const c of pref) { if (drop_avail(c)) return c; }
  return 0;
}

function wouldWin(col, who) {
  const r = getRow(col);
  if (r === -1) return false;
  grid[r][col] = who;
  const w = getWinCells(r, col, who);
  grid[r][col] = null;
  return !!w;
}

function drop_avail(col) { return grid[0][col] === null; }
function getRow(col) { for (let r = ROWS-1; r >= 0; r--) { if (!grid[r][col]) return r; } return -1; }

function getWinCells(row, col, who) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr,dc] of dirs) {
    let cells = [[row,col]];
    for (let i=1;i<4;i++){const r=row+dr*i,c=col+dc*i;if(r>=0&&r<ROWS&&c>=0&&c<COLS&&grid[r][c]===who)cells.push([r,c]);else break;}
    for (let i=1;i<4;i++){const r=row-dr*i,c=col-dc*i;if(r>=0&&r<ROWS&&c>=0&&c<COLS&&grid[r][c]===who)cells.push([r,c]);else break;}
    if (cells.length >= 4) return cells;
  }
  return null;
}

function isDraw() { return grid[0].every(c => c !== null); }

function endGame(winner, winCells) {
  gameOver = true;
  if (winCells) render(winCells);
  if (winner === 'player') {
    scores.player++;
    document.getElementById('score-player').textContent = scores.player;
    setStatus('You win!');
  } else if (winner === 'ai') {
    scores.ai++;
    document.getElementById('score-ai').textContent = scores.ai;
    setStatus('AI wins!');
  } else {
    setStatus("It's a draw!");
  }
  setTimeout(() => init(), 2500);
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

document.getElementById('reset-btn').addEventListener('click', init);
init();
</script>
